plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zminesweeper.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.zminesweeper.game"
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "1.2.7"
        // Ограничиваем языки, чтобы ускорить обработку ресурсов.
        resConfigs 'ru', 'en', 'es'
    }

    // Фиксированный debug keystore в репозитории.
    // Без этого: каждый компьютер генерирует свой debug.keystore →
    // Android блокирует обновление ("конфликт пакетов").
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // aapt2 сильно тормозит на тысячах ресурсов в большом проекте.
    aaptOptions {
        cruncherProcesses 4
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // WebSocket client for cross-platform multiplayer (relay server)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
