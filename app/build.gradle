plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zminesweeper.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.zminesweeper.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Ограничиваем языки, чтобы ускорить обработку ресурсов.
        resConfigs 'ru', 'en'
    }

    // aapt2 сильно тормозит на тысячах ресурсов в большом проекте.
    aaptOptions {
        cruncherProcesses 4
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
